name: evaluation

# Extended deterministic evaluation — manual/scheduled only (never on push):
# runs the full pytest suite plus the key-free evaluation suites
# (RAG retrieval metrics + SQL-eval plumbing with the offline mock provider).
# Paid live LLM evals are NOT run in CI (no API keys in runners by design);
# use `scripts/run_eval.py --suite sql --model ...` locally with a key.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC — weekly drift check

jobs:
  deterministic-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Full pytest (fast + new security/regression suites)
        run: pytest -q
      - name: RAG retrieval eval (deterministic, chunk-level)
        run: python scripts/eval_rag.py
      - name: SQL eval plumbing check (mock provider — validates harness, not quality)
        run: python scripts/evaluate.py --suite sql --model mock --limit 5
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            backend/bench_results/*.json
          retention-days: 30
