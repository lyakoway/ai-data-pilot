    <script>
      // Theme and language BEFORE first paint — same ladder as prefs.ts:
      // URL ?theme=/&lang= → localStorage → dark theme / English.
      (function () {
        try {
          var q = new URLSearchParams(location.search)
          var t = q.get('theme') || localStorage.getItem('adp-theme')
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
          var l = q.get('lang') || localStorage.getItem('adp-lang')
          document.documentElement.lang = l === 'ru' ? 'ru' : 'en'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
